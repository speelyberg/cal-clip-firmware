name: CAL app-only firmware
on:
  push:
    branches: ['cal/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cal-firmware-${{ github.ref }}
  cancel-in-progress: true
env:
  # Seeed v0.1.4 (tag v0.1.4). Files added since this commit count as ours in the warning gate.
  STOCK_BASE: 95db10b0d73529fc239deb34c62d80e5978e83b3
jobs:
  application:
    name: ${{ matrix.variant }} application
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, production]
    steps:
      - uses: actions/checkout@v4
        with:
          path: respeaker_clip
      - name: CAL tool tests
        run: python3 -m unittest discover -s respeaker_clip/tools/cal -p 'test_*.py'
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache cmake device-tree-compiler dfu-util file g++-multilib gcc gcc-multilib git gperf make ninja-build python3-dev python3-pip python3-setuptools python3-venv python3-wheel wget xz-utils libsdl2-dev libmagic1
          pip3 install west
      - name: Zephyr SDK 0.17.0
        run: |
          wget -q --tries=3 --retry-connrefused --waitretry=5 https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz -C "$HOME"
          "$HOME/zephyr-sdk-0.17.0/setup.sh" -c -t arm-zephyr-eabi
      - name: NCS v3.3.0
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.3.0 ncs
          cd ncs
          west update --narrow -o=--depth=1
          pip3 install -r zephyr/scripts/requirements-base.txt -r nrf/scripts/requirements.txt
      - name: Apply the board's MCUboot build patches
        run: |
          cd ncs/bootloader/mcuboot
          for patch in "$GITHUB_WORKSPACE"/respeaker_clip/patches/mcuboot/0*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
      - name: Compile the application
        shell: bash
        run: |
          set -o pipefail
          cd ncs
          export ZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE/respeaker_clip"
          APP="$GITHUB_WORKSPACE/respeaker_clip/applications/clip"
          EXTRA=()
          if [[ '${{ matrix.variant }}' == production ]]; then EXTRA=(-DSNIPPET_ROOT="$APP" -DSNIPPET=production); fi
          west build -b clip/nrf5340/cpuapp "$APP" --build-dir build --pristine=always -- "${EXTRA[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Warning gate (any in our code, or any not in the stock v0.1.4 baseline)
        shell: bash
        run: |
          set -euo pipefail
          git -C respeaker_clip fetch --no-tags --depth=1 origin "$STOCK_BASE"
          ADDED=$(git -C respeaker_clip diff --name-only --diff-filter=A "$STOCK_BASE" HEAD)
          OURS=(--ours respeaker_clip/applications/clip/)
          while IFS= read -r f; do if [[ -n $f ]]; then OURS+=(--ours "respeaker_clip/$f"); fi; done <<< "$ADDED"
          printf 'Owned: applications/clip/ and files added since stock:\n%s\n' "$ADDED"
          python3 respeaker_clip/tools/cal/warning_gate.py build.log --baseline respeaker_clip/tools/cal/warning-baseline.txt "${OURS[@]}"
      - name: Verify and export application image only
        id: export
        shell: bash
        run: |
          set -euo pipefail
          APP_IMAGE=ncs/build/clip/zephyr/zephyr.signed.bin
          KEY=respeaker_clip/boards/seeed/clip/sysbuild/root-rsa-2048.pem
          python3 ncs/bootloader/mcuboot/scripts/imgtool.py verify -k "$KEY" "$APP_IMAGE"
          # Overwrite-only: the image must fit both app slots with its trailer.
          SLOT=$(python3 -c "import yaml;pm=yaml.safe_load(open('ncs/build/partitions.yml'));print(min(pm['mcuboot_primary']['size'],pm['mcuboot_secondary']['size']))")
          VERSION=$(python3 -c "import sys;sys.path.insert(0,'respeaker_clip/tools/cal');from artifact import inspect_image;print(inspect_image('$APP_IMAGE', $SLOT)['version'])")
          SHA=$(git -C respeaker_clip rev-parse --short=12 HEAD)
          NAME="clip-${VERSION}-${SHA}-${{ matrix.variant }}"
          mkdir -p output
          cp "$APP_IMAGE" "output/$NAME.signed.bin"
          python3 respeaker_clip/tools/cal/artifact.py "output/$NAME.signed.bin" --variant '${{ matrix.variant }}' \
            --source-sha "$(git -C respeaker_clip rev-parse HEAD)" --slot-size "$SLOT" --config ncs/build/clip/zephyr/.config \
            --build-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --output "output/$NAME.json"
          cp ncs/build/clip/zephyr/.config "output/$NAME.config"
          cp ncs/build/partitions.yml "output/$NAME.partitions.yml"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.export.outputs.name || format('cal-app-{0}-{1}-incomplete', github.sha, matrix.variant) }}
          path: |
            output/
            build.log
          if-no-files-found: warn
